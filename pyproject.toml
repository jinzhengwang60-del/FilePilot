[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot-local"
version = "0.1.0"
description = "A private, preview-first Windows file organizer with a durable undo journal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9,<7"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["PyInstaller>=6.16,<7"]

[project.gui-scripts]
filepilot = "filepilot.app:main"

[project.scripts]
filepilot-cli = "filepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filepilot = ["assets/*.svg", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
